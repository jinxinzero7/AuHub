services:
  # Identity Database
  identity-db:
    image: postgres:16-alpine
    container_name: auhub-identity-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: identitydb
    ports:
      - "5433:5432"
    volumes:
      - identity_data:/var/lib/postgresql/data
    networks:
      - auhub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Auctions Database
  auctions-db:
    image: postgres:16-alpine
    container_name: auhub-auctions-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: auctionsdb
    ports:
      - "5432:5432"
    volumes:
      - auctions_data:/var/lib/postgresql/data
    networks:
      - auhub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Identity Service
  identity-api:
    build:
      context: .
      dockerfile: Identity.Dockerfile
    container_name: auhub-identity-api
    ports:
      - "5109:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=identity-db;Database=identitydb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=AuHub
      - Jwt__Audience=AuHub-Users
    depends_on:
      identity-db:
        condition: service_healthy
    networks:
      - auhub-network

  # Auctions Service
  auctions-api:
    build:
      context: .
      dockerfile: Auctions.Dockerfile
    container_name: auhub-auctions-api
    ports:
      - "5108:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=auctions-db;Database=auctionsdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=AuHub
      - Jwt__Audience=AuHub-Users
      - MinIO__Endpoint=minio:9000
      - MinIO__ExternalEndpoint=http://localhost:9000
      - MinIO__AccessKey=${MINIO_ROOT_USER:-auhub-minio-admin}
      - MinIO__SecretKey=${MINIO_ROOT_PASSWORD:-AuHub_MinIO_2026_Secure!}
      - MinIO__BucketName=auhub-lots
      - MinIO__WithSSL=false
    depends_on:
      auctions-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - auhub-network

  # API Gateway
  gateway:
    build:
      context: .
      dockerfile: Gateway.Dockerfile
    container_name: auhub-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - identity-api
      - auctions-api
    networks:
      - auhub-network

  # MinIO - Object Storage for images
  minio:
    image: minio/minio:latest
    container_name: auhub-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-auhub-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-AuHub_MinIO_2026_Secure!}
    volumes:
      - minio_data:/data
    networks:
      - auhub-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend - Next.js
  frontend:
    build:
      context: ../auhub-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    container_name: auhub-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      - INTERNAL_API_URL=http://gateway:8080
    depends_on:
      - gateway
    networks:
      - auhub-network

volumes:
  identity_data:
  auctions_data:
  minio_data:

networks:
  auhub-network:
    driver: bridge
