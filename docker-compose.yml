services:
  # Identity Database
  identity-db:
    image: postgres:16-alpine
    container_name: auhub-identity-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: identitydb
    ports:
      - "5433:5432"
    volumes:
      - identity_data:/var/lib/postgresql/data
    networks:
      - auhub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Auctions Database
  auctions-db:
    image: postgres:16-alpine
    container_name: auhub-auctions-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: auctionsdb
    ports:
      - "5432:5432"
    volumes:
      - auctions_data:/var/lib/postgresql/data
    networks:
      - auhub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Notifications Database
  notifications-db:
    image: postgres:16-alpine
    container_name: auhub-notifications-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: notificationsdb
    ports:
      - "5434:5432"
    volumes:
      - notifications_data:/var/lib/postgresql/data
    networks:
      - auhub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Payment Database
  payment-db:
    image: postgres:16-alpine
    container_name: auhub-payment-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: paymentdb
    ports:
      - "5435:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data
    networks:
      - auhub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Identity Service
  identity-api:
    build:
      context: .
      dockerfile: Identity.Dockerfile
    container_name: auhub-identity-api
    ports:
      - "5109:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=identity-db;Database=identitydb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=AuHub
      - Jwt__Audience=AuHub-Users
      - AdminBootstrap__Email=${ADMIN_BOOTSTRAP_EMAIL:-}
      - AdminBootstrap__Password=${ADMIN_BOOTSTRAP_PASSWORD:-}
      - AdminBootstrap__Name=${ADMIN_BOOTSTRAP_NAME:-AuHub Admin}
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_ROOT_USER:-auhub-minio-admin}
      - MinIO__SecretKey=${MINIO_ROOT_PASSWORD:-AuHub_MinIO_2026_Secure!}
      - MinIO__DocumentBucketName=auhub-documents
      - MinIO__WithSSL=false
    depends_on:
      identity-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - auhub-network

  # Auctions Service
  auctions-api:
    build:
      context: .
      dockerfile: Auctions.Dockerfile
    container_name: auhub-auctions-api
    ports:
      - "5108:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=auctions-db;Database=auctionsdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=AuHub
      - Jwt__Audience=AuHub-Users
      - InternalApiKey=${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      - ExternalUrl__BaseUrl=http://localhost:5000
      - Notifications__BaseUrl=http://notifications-api:8080
      - Payment__BaseUrl=http://payment-api:8080
      - MinIO__Endpoint=minio:9000
      - MinIO__ExternalEndpoint=http://localhost:9000
      - MinIO__AccessKey=${MINIO_ROOT_USER:-auhub-minio-admin}
      - MinIO__SecretKey=${MINIO_ROOT_PASSWORD:-AuHub_MinIO_2026_Secure!}
      - MinIO__BucketName=auhub-lots
      - MinIO__WithSSL=false
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__User=${RABBITMQ_USER:-auhub}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-AuHub_Rabbit_2026!}
    depends_on:
      auctions-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - auhub-network

  # Notifications Service
  notifications-api:
    build:
      context: .
      dockerfile: Notifications.Dockerfile
    container_name: auhub-notifications-api
    ports:
      - "5110:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=notifications-db;Database=notificationsdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=AuHub
      - Jwt__Audience=AuHub-Users
      - InternalApiKey=${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__User=${RABBITMQ_USER:-auhub}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-AuHub_Rabbit_2026!}
    depends_on:
      notifications-db:
        condition: service_healthy
    networks:
      - auhub-network

  # Payment Service
  payment-api:
    build:
      context: .
      dockerfile: Payment.Dockerfile
    container_name: auhub-payment-api
    ports:
      - "5111:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=payment-db;Database=paymentdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=AuHub
      - Jwt__Audience=AuHub-Users
      - InternalApiKey=${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      - PaymentProviders__Robokassa__MerchantLogin=${ROBOKASSA_MERCHANT_LOGIN:-}
      - PaymentProviders__Robokassa__Password1=${ROBOKASSA_PASSWORD1:-}
      - PaymentProviders__Robokassa__Password2=${ROBOKASSA_PASSWORD2:-}
      - PaymentProviders__Robokassa__IsTest=${ROBOKASSA_IS_TEST:-true}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__User=${RABBITMQ_USER:-auhub}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-AuHub_Rabbit_2026!}
    depends_on:
      payment-db:
        condition: service_healthy
    networks:
      - auhub-network

  # API Gateway
  gateway:
    build:
      context: .
      dockerfile: Gateway.Dockerfile
    container_name: auhub-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - identity-api
      - auctions-api
      - payment-api
    networks:
      - auhub-network

  # RabbitMQ - Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: auhub-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-auhub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-AuHub_Rabbit_2026!}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - auhub-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - Object Storage for images
  minio:
    image: minio/minio:latest
    container_name: auhub-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-auhub-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-AuHub_MinIO_2026_Secure!}
    volumes:
      - minio_data:/data
    networks:
      - auhub-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend - Next.js
  frontend:
    build:
      context: ../auhub-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    container_name: auhub-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      - INTERNAL_API_URL=http://gateway:8080
    depends_on:
      - gateway
    networks:
      - auhub-network

volumes:
  identity_data:
  auctions_data:
  notifications_data:
  payment_data:
  rabbitmq_data:
  minio_data:

networks:
  auhub-network:
    driver: bridge
