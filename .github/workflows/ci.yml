name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: 10.0.x

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore AuctionHub.slnx

      - name: Build
        run: dotnet build AuctionHub.slnx --no-restore --configuration Release

      - name: Unit Tests
        run: |
          dotnet test tests/Shared.UnitTests/Shared.UnitTests.csproj --no-build --configuration Release --logger "trx;LogFileName=shared-unit-test-results.trx" --collect:"XPlat Code Coverage" --settings tests/coverlet.runsettings
          dotnet test tests/Auctions.UnitTests/Auctions.UnitTests.csproj --no-build --configuration Release --logger "trx;LogFileName=auctions-unit-test-results.trx" --collect:"XPlat Code Coverage" --settings tests/coverlet.runsettings
          dotnet test tests/Identity.UnitTests/Identity.UnitTests.csproj --no-build --configuration Release --logger "trx;LogFileName=identity-unit-test-results.trx" --collect:"XPlat Code Coverage" --settings tests/coverlet.runsettings
          dotnet test tests/Notifications.UnitTests/Notifications.UnitTests.csproj --no-build --configuration Release --logger "trx;LogFileName=notifications-unit-test-results.trx" --collect:"XPlat Code Coverage" --settings tests/coverlet.runsettings
          dotnet test tests/Payment.UnitTests/Payment.UnitTests.csproj --no-build --configuration Release --logger "trx;LogFileName=payment-unit-test-results.trx" --collect:"XPlat Code Coverage" --settings tests/coverlet.runsettings

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-results
          path: "**/coverage.cobertura.xml"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore AuctionHub.slnx

      - name: Build
        run: dotnet build AuctionHub.slnx --no-restore --configuration Release

      - name: Integration Tests
        run: |
          dotnet test tests/Auctions.IntegrationTests/Auctions.IntegrationTests.csproj --no-build --configuration Release --logger "trx;LogFileName=auctions-integration-test-results.trx"
          dotnet test tests/Identity.IntegrationTests/Identity.IntegrationTests.csproj --no-build --configuration Release --logger "trx;LogFileName=identity-integration-test-results.trx"
          dotnet test tests/Notifications.IntegrationTests/Notifications.IntegrationTests.csproj --no-build --configuration Release --logger "trx;LogFileName=notifications-integration-test-results.trx"
          dotnet test tests/Payment.IntegrationTests/Payment.IntegrationTests.csproj --no-build --configuration Release --logger "trx;LogFileName=payment-integration-test-results.trx"

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: "**/*integration-test-results.trx"

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      JWT_SECRET: AuHub_CI_Jwt_Secret_Only_For_Docker_Build_2026
      INTERNAL_API_KEY: AuHub_CI_Internal_Api_Key_Only_For_Docker_Build_2026
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker compose -f docker-compose.yml build \
            identity-api auctions-api notifications-api payment-api gateway
